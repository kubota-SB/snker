<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Air Jordan 1を発売年代順に探せるスニーカー図鑑。360°ビューと市場価格チャートに対応。">
  <title>Air Jordan 1 Archive</title>
  <link rel="preconnect" href="https://images.stockx.com">
  <link rel="preconnect" href="https://cdn.snkrdunk.com">
  <link rel="stylesheet" href="snker.css">
  <script src="snker.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="hero-inner">
      <p class="eyebrow">AIR JORDAN 1 ARCHIVE</p>
      <h1>Air Jordan 1 図鑑</h1>
      <p class="hero-copy">OGから2026年まで。年代を選んで、必要なモデルだけ軽く表示します。</p>
      <div class="search-row">
        <label class="search-box">
          <span class="sr-only">モデル名・カラー・商品番号を検索</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Chicago / シャタバ / DZ5485…">
        </label>
        <button id="clearBtn" class="clear-btn" type="button">クリア</button>
      </div>
      <div class="hero-status">
        <span id="resultCount">データを読み込み中…</span>
        <span id="modeLabel">2026年を表示</span>
      </div>
    </div>
  </header>

  <nav class="year-nav" aria-label="発売年代">
    <div id="yearNav" class="year-nav-inner"></div>
  </nav>

  <main class="archive-main">
    <section class="section-head">
      <div>
        <p class="section-kicker">RELEASE ARCHIVE</p>
        <h2 id="sectionTitle">2026年発売</h2>
      </div>
      <p id="sectionCount" class="section-count"></p>
    </section>

    <div id="loadingState" class="state-card">スニーカーデータを読み込んでいます…</div>
    <div id="emptyState" class="state-card" hidden>該当するモデルがありません。</div>
    <div id="sneakerGrid" class="sneaker-grid" aria-live="polite"></div>
  </main>

  <button id="scrollTopBtn" class="scroll-top" type="button" aria-label="ページ上部へ戻る">↑</button>

  <dialog id="detailDialog" class="detail-dialog">
    <div class="dialog-shell">
      <button id="closeDialogBtn" class="dialog-close" type="button" aria-label="閉じる">×</button>
      <div id="detailContent"></div>
    </div>
  </dialog>

  <footer class="site-footer">
    <p>Air Jordan 1 Archive · 1985–2026</p>
    <small>画像・価格情報は各外部サービスの公開状況により取得できない場合があります。</small>
  </footer>
</body>
</html>
